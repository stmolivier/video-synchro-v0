<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visionneuse synchronisée - 3 caméras</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <header>
        <label for="videoFolder">Session :</label>
        <select id="videoFolder">
            <option value="session_001">Session 001</option>
            <option value="session_002">Session 002</option>
            <option value="essai_exterieur">Essai extérieur</option>
        </select>
        <button id="play">Play</button>
        <button id="pause">Pause</button>
        <button id="stop">Stop</button>
        <button id="restart">Recommencer</button>
        <span id="videoStatus">Prêt</span>

        <div class="timeline">
            <span id="currentTime">00:00</span>
            <input type="range" id="timeline" min="0" max="100" step="0.01" value="0" disabled>
            <span id="duration">00:00</span>
        </div>
    </header>

    <main>
        <section class="camera">
            <h2>Caméra 1</h2>
            <video id="camera1" preload="auto"></video>
            <div class="camera-error" hidden>Vidéo indisponible</div>
        </section>

        <section class="camera">
            <h2>Caméra 2</h2>
            <video id="camera2" preload="auto"></video>
            <div class="camera-error" hidden>Vidéo indisponible</div>
        </section>

        <section class="camera">
            <h2>Caméra 3</h2>
            <video id="camera3" preload="auto"></video>
            <div class="camera-error" hidden>Vidéo indisponible</div>
        </section>

        <div class="empty"></div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
